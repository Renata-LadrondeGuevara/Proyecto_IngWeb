<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Panel - Administrador / Cliente / Empleado</title>
  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#111;
      color:#eee;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }
    .container{
      text-align:center;
    }
    h1{margin-bottom:20px}
    .btn{
      display:inline-block;
      margin:10px;
      padding:15px 30px;
      border:none;
      border-radius:10px;
      font-size:18px;
      cursor:pointer;
      color:#fff;
      transition:transform 0.2s ease;
    }
    .btn:hover{transform:scale(1.05)}
    .admin{background:linear-gradient(135deg,#ff5f6d,#ffc371)}
    .cliente{background:linear-gradient(135deg,#06b6d4,#3ddad7)}
    .empleado{background:linear-gradient(135deg,#7af270,#2bd16b)}
  </style>
</head>
<body>
  <div class="container">
    <h1>Selecciona tu perfil</h1>
    <a href="admin.html" style="text-decoration:none"><button class="btn admin">Administrador</button></a>
    <a href="cliente.html" style="text-decoration:none"><button class="btn cliente">Cliente</button></a>
    <a href="empleado.html" style="text-decoration:none"><button class="btn empleado">Empleado</button></a>
  </div>
</body>
</html>
